#localhost

# controller
server.servlet.context-path=/mvp
server.servlet.session.timeout=1200
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.port=8080
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# security
default.system=mvp
default.domain=
default.language=zh_TW
default.login.reset=30
default.login.error=3
default.login.lock=5
default.login.delay=900

# client 
default.client.1=
default.client.2=
default.client.3=
default.green.1=
default.green.2=
default.green.3=
default.api.only=1
