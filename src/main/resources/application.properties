default.api.2=1; app; http://127.0.0.1:8080/mvp
default.api.3=
default.job.1=1
default.job.2=1
default.job.3=0

#六日未回覆AI外撥
default.job.4=1

#餘三日未回覆重發驗證信
default.job.5=1

#產生外撥名單檔案 要上傳的FTP伺服器的IP
GenAiCallingRptServ.FTP_IP=xxx.xxx.xxx.xxx
#要下載AI外撥回饋檔案 的FTP伺服器的IP
ImportAiResultServ.FTP_IP=xxx.xxx.xxx.xxx

mvp.home.dir=/home/mvpadm
mvp.report.dir=/home/mvpadm/reports
mvp.sh.dir=/home/mvpadm/sh

#指定要建立的外撥檔案名稱 前綴字眼
mvp.ai_calling_filename_prefix=AI_CALLING_

#解決 spring.jpa.open-in-view 預設啟用 會讓 DB session 在整個 HTTP request 期間保持開啟，可能造成效能問題
spring.jpa.open-in-view=false

